[package]
name = "flake-checker"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
notify-rust = "4.17.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
